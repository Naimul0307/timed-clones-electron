<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Visual Settings</title>
  <link rel="stylesheet" href="../css/basic.css" />
  <link rel="stylesheet" href="../css/settings.css" />
  <link
    rel="stylesheet"
    href="../css/pickr.min.css"
  />
</head>

<body>

  <div class="settings-wrapper">
    <h1>Visual Settings</h1>

    <p class="hint">
      Change glow, shadow, scanline, and light colors.
    </p>

    <div id="colorPickersContainer"></div>
    <div class="settings-section">
    <h2>Motion Settings</h2>

    <label>Clone Interval</label>
    <input id="cloneInterval" type="number" min="10" max="1000" />

    <label>Max Clones</label>
    <input id="maxClones" type="number" min="1" max="20" />

    <label>Motion Threshold</label>
    <input id="motionThreshold" type="number" min="1" max="255" />

    <label>Snapshot Motion Limit</label>
    <input id="snapshotMotionLimit" type="number" min="1" max="255" />

    <label>Max Snapshots</label>
    <input id="maxSnapshots" type="number" min="1" max="20" />

    <label>Leap Clone Boost</label>
    <input id="leapCloneBoost" type="number" step="0.1" min="0" max="5" />

    <label>Leap Drift Boost</label>
    <input id="leapDriftBoost" type="number" step="0.1" min="0" max="5" />

    <label class="checkbox-row">
        <input id="leapColorBoost" type="checkbox" />
        Leap Color Boost
    </label>
    </div>
    <button id="saveSettingsBtn">
      Save Settings
    </button>

    <div id="statusMessage"></div>
  </div>

  <script src="../js/pickr.min.js"></script>
  <script src="../js/settings.js"></script>

</body>
</html>
